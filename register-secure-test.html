<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiamondScout — Player Check-in</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:linear-gradient(#a8daf5,#eef8ff 320px);color:#17344b}main{max-width:520px;margin:30px auto;padding:16px}.card{background:white;border:1px solid #c4deeb;border-radius:18px;padding:24px;box-shadow:0 5px 18px #1633}h1{margin:0 0 8px}p{line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #a7bfd0;border-radius:9px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:10px;background:#c92a3a;color:white;font:inherit;font-weight:800;margin-top:24px}button:disabled{opacity:.6}.positions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.positions label{display:flex;align-items:center;gap:7px;padding:10px;border:1px solid #c4deeb;border-radius:9px;margin:0;font-size:14px}.positions input{width:auto}#msg{margin-top:16px;font-weight:600}.muted{color:#567083;font-size:14px}</style></head><body><main><div class="card"><h1>⚾ DiamondScout</h1><p>Player tryout registration</p><p class="muted">Parents: complete one form per player. A coach will review the registration and assign a tryout number.</p><form id="form"><label for="first">Player first name</label><input id="first" maxlength="70" autocomplete="given-name" required><label for="last">Player last name</label><input id="last" maxlength="70" autocomplete="family-name" required><label for="division">Tryout division</label><select id="division"><option value="9u">9U</option><option value="10u">10U</option></select><label>Positions played (choose all that apply)</label><div class="positions" id="positions"></div><button id="submit">Submit registration</button></form><div id="msg" role="status" aria-live="polite"></div></div></main><script>(()=>{'use strict';const url='https://odlhskrhzjgvlbxevqny.supabase.co',key='sb_publishable_QmW4KLpbLW1AKwBh3TmEog_7pTl43rU';const $=id=>document.getElementById(id);$('positions').innerHTML=['P','C','1B','2B','SS','3B','LF','CF','RF'].map(p=>'<label><input type="checkbox" value="'+p+'">'+p+'</label>').join('');const params=new URLSearchParams(location.search),division=params.get('division');if(['9u','10u'].includes(division))$('division').value=division;$('form').onsubmit=async e=>{e.preventDefault();const first=$('first').value.trim().replace(/\s+/g,' '),last=$('last').value.trim().replace(/\s+/g,' '),positions=[...$('positions').querySelectorAll('input:checked')].map(x=>x.value);if(!positions.length){$('msg').textContent='Select at least one position.';return}const b=$('submit');b.disabled=true;$('msg').textContent='Submitting…';try{const response=await fetch(url+'/functions/v1/submit-registration',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({first_name:first,last_name:last,division:$('division').value,positions})});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.message||'Registration is unavailable.');$('form').reset();$('msg').textContent='✓ Registration submitted! Please check in with a coach for your tryout number.';b.textContent='Submit another player'}catch(err){$('msg').textContent=err.message||'Registration unavailable. Please ask a coach to check you in.';}finally{b.disabled=false}}})();</script></body></html>
